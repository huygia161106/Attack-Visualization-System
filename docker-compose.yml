services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: attack_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: cyberthreat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cyber-network

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: attack_redis
    ports:
      - "6379:6379"
    networks:
      - cyber-network

  # 3. Kafka (Sử dụng chuẩn KRaft mới, không cần Zookeeper)
  # 3. Kafka (Sử dụng chuẩn KRaft mới, không cần Zookeeper)
  # 3. Kafka (Sử dụng Image Chính Chủ của Apache, chuẩn KRaft)
  kafka:
    image: apache/kafka:3.7.0
    container_name: attack_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - cyber-network

  # 4. Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: attack_backend
    ports:
      - "8080:8080"
    volumes:
      # Nối thư mục MaxMind từ máy bạn vào container theo đúng đường dẫn trong GeoIPService.java
      - ./Database/GeoLite2-City:/app/geoip
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - cyber-network

  # 5. Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: attack_frontend
    ports:
      - "80:80" # Truy cập web tại http://localhost
    depends_on:
      - backend
    networks:
      - cyber-network

networks:
  cyber-network:
    driver: bridge

volumes:
  pgdata: