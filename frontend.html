<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map</title>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/world.js"></script>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #020611, #000);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
}

/* MAP */
#map {
    width: 100%;
    height: 100vh;
}

/* HEADER */
#header {
    position: absolute;
    top: 15px;
    left: 20px;
    color: #00f0ff;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 10px #00f0ff;
}

/* TIMELINE */
#timeline {
    position: absolute;
    right: 20px;
    top: 70px;
    width: 280px;
    height: 420px;
    overflow-y: auto;
    background: rgba(0,0,0,0.6);
    border: 1px solid #00f0ff33;
    border-radius: 12px;
    backdrop-filter: blur(6px);
    color: #00f0ff;
    padding: 10px;
    box-shadow: 0 0 20px #00f0ff33;
}

/* EVENT ITEM */
.event {
    margin-bottom: 10px;
    padding: 8px;
    border-bottom: 1px solid #00f0ff22;
    font-size: 13px;
    transition: 0.2s;
}
.event:hover {
    background: #00f0ff11;
}

/* RADAR EFFECT */
.radar {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 1px solid #00f0ff33;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rotate 6s linear infinite;
}

.radar::after {
    content: "";
    position: absolute;
    width: 50%;
    height: 50%;
    background: linear-gradient(90deg, transparent, #00f0ff);
    top: 0;
    left: 50%;
    transform-origin: bottom left;
}

@keyframes rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
}
</style>
</head>

<body>

<div id="header">🌐 CYBER THREAT MAP</div>
<div id="map"></div>
<div class="radar"></div>
<div id="timeline"></div>

<script>
const chart = echarts.init(document.getElementById('map'));

let attacks = [];

const option = {
    backgroundColor: 'transparent',
    geo: {
        map: 'world',
        roam: true,
        zoom: 1.2,
        itemStyle: {
            areaColor: '#072a40',
            borderColor: '#00f0ff33'
        },
        emphasis: {
            itemStyle: {
                areaColor: '#0b3d5c'
            }
        }
    },
    series: []
};

chart.setOption(option);

/* UPDATE CHART */
function updateChart() {
    chart.setOption({
        series: [
            {
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 2,
                effect: {
                    show: true,
                    period: 4,
                    trailLength: 0.5,
                    symbol: 'arrow',
                    symbolSize: 6,
                    color: '#00f0ff'
                },
                lineStyle: {
                    color: '#00f0ff',
                    width: 1,
                    opacity: 0.5,
                    curveness: 0.3
                },
                data: attacks.map(a => ({
                    coords: [a.from, a.to],
                    value: a
                }))
            },
            {
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 3,
                rippleEffect: {
                    brushType: 'stroke'
                },
                symbolSize: 6,
                itemStyle: {
                    color: '#ff3c3c'
                },
                data: attacks.map(a => ({
                    value: [...a.to, 1]
                }))
            }
        ]
    });
}

/* TIMELINE */
function renderTimeline() {
    const div = document.getElementById("timeline");
    div.innerHTML = attacks.slice(-20).reverse().map(a => `
        <div class="event">
            <b>${a.time}</b><br/>
            ${a.fromCountry} → ${a.toCountry}<br/>
            IP: ${a.ip}<br/>
            Type: ${a.type}
        </div>
    `).join('');
}

/* RANDOM DATA */
function randomCoord() {
    return [
        Math.random() * 360 - 180,
        Math.random() * 180 - 90
    ];
}

function randomCountry() {
    const list = ["USA", "China", "Russia", "Germany", "Vietnam", "Brazil"];
    return list[Math.floor(Math.random() * list.length)];
}

function randomIP() {
    return `${rand()}.${rand()}.${rand()}.${rand()}`;
}
function rand() { return Math.floor(Math.random()*255); }

function randomType() {
    const types = ["DDoS", "Malware", "Botnet", "Exploit"];
    return types[Math.floor(Math.random() * types.length)];
}

function getTime() {
    return new Date().toLocaleTimeString();
}

/* ADD ATTACK */
function addAttack() {
    const attack = {
        from: randomCoord(),
        to: randomCoord(),
        ip: randomIP(),
        type: randomType(),
        fromCountry: randomCountry(),
        toCountry: randomCountry(),
        time: getTime()
    };

    attacks.push(attack);
    if (attacks.length > 60) attacks.shift();

    updateChart();
    renderTimeline();
}

/* LOOP */
setInterval(addAttack, 1200);

/* CLICK */
chart.on('click', function (params) {
    if (params.data && params.data.value) {
        const a = params.data.value;
        alert(
            `ATTACK\nIP: ${a.ip}\n${a.fromCountry} → ${a.toCountry}\nType: ${a.type}`
        );
    }
});
</script>

</body>
</html>
