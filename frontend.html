<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map</title>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/world.js"></script>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #020611, #000);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
}

/* MAP */
#map {
    width: 100%;
    height: 100vh;
}

/* HEADER */
#header {
    position: absolute;
    top: 15px;
    left: 20px;
    color: #00f0ff;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 10px #00f0ff;
}

/* TIMELINE */
#timeline {
    position: absolute;
    right: 20px;
    top: 70px;
    width: 280px;
    height: 420px;
    overflow-y: auto;
    background: rgba(0,0,0,0.6);
    border: 1px solid #00f0ff33;
    border-radius: 12px;
    backdrop-filter: blur(6px);
    color: #00f0ff;
    padding: 10px;
    box-shadow: 0 0 20px #00f0ff33;
}

/* EVENT ITEM */
.event {
    margin-bottom: 10px;
    padding: 8px;
    border-bottom: 1px solid #00f0ff22;
    font-size: 13px;
    transition: 0.2s;
}
.event:hover {
    background: #00f0ff11;
}

/* RADAR EFFECT */
.radar {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 1px solid #00f0ff33;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rotate 6s linear infinite;
}

.radar::after {
    content: "";
    position: absolute;
    width: 50%;
    height: 50%;
    background: linear-gradient(90deg, transparent, #00f0ff);
    top: 0;
    left: 50%;
    transform-origin: bottom left;
}

@keyframes rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
}
</style>
</head>

<body>

<div id="header">🌐 CYBER THREAT MAP</div>
<div id="map"></div>
<div class="radar"></div>
<div id="timeline"></div>

<script>
const chart = echarts.init(document.getElementById('map'));

let attacks = [];

fetch('http://localhost:8080/api/events/api/events')
    .then(response => response.json())
    .then(data => {
        // Dữ liệu từ DB trả về mới nhất ở đầu, ta reverse để vẽ từ cũ tới mới
        data.reverse().forEach(event => {
            if (event.srcLng && event.srcLat) {
                attacks.push({
                    time: new Date(event.timestamp).toLocaleTimeString(),
                    from: [event.srcLng, event.srcLat],
                    to: [106.8031, 10.8701],
                    ip: event.srcIp,
                    type: event.attackType,
                    fromCountry: event.country || "Unknown",
                    toCountry: "Vietnam"
                });
            }
        });
        
        // Vẽ ngay lập tức
        updateChart();
        renderTimeline();
        console.log("Đã nạp xong lịch sử tấn công từ Database!");
    })
    .catch(error => console.error("Lỗi nạp lịch sử:", error));

const option = {
    backgroundColor: 'transparent',
    geo: {
        map: 'world',
        roam: true,
        zoom: 1.2,
        itemStyle: {
            areaColor: '#072a40',
            borderColor: '#00f0ff33'
        },
        emphasis: {
            itemStyle: {
                areaColor: '#0b3d5c'
            }
        }
    },
    series: []
};

chart.setOption(option);

/* UPDATE CHART */
function updateChart() {
    chart.setOption({
        series: [
            {
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 2,
                effect: {
                    show: true,
                    period: 4,
                    trailLength: 0.5,
                    symbol: 'arrow',
                    symbolSize: 6,
                    color: '#00f0ff'
                },
                lineStyle: {
                    color: '#00f0ff',
                    width: 1,
                    opacity: 0.5,
                    curveness: 0.3
                },
                data: attacks.map(a => ({
                    coords: [a.from, a.to],
                    value: a
                }))
            },
            {
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 3,
                rippleEffect: {
                    brushType: 'stroke'
                },
                symbolSize: 6,
                itemStyle: {
                    color: '#ff3c3c'
                },
                data: attacks.map(a => ({
                    value: [...a.to, 1]
                }))
            }
        ]
    });
}

/* TIMELINE */
function renderTimeline() {
    const div = document.getElementById("timeline");
    div.innerHTML = attacks.slice(-20).reverse().map(a => `
        <div class="event">
            <b>${a.time}</b><br/>
            ${a.fromCountry} → ${a.toCountry}<br/>
            IP: ${a.ip}<br/>
            Type: ${a.type}
        </div>
    `).join('');
}

/* KẾT NỐI WEBSOCKET ĐẾN JAVA BACKEND */
// Trỏ thẳng đến container backend chạy ở port 8080 trong Docker
const socket = new WebSocket('ws://localhost:8080/ws/live');

socket.onopen = () => {
    console.log("Đã kết nối tới Java Spring Boot WebSocket Backend");
};

socket.onmessage = function(event) {
    try {
        // 1. Parse dữ liệu (Lúc này realAttacks đang là 1 MẢNG chứa nhiều cuộc tấn công)
        const attackList = JSON.parse(event.data);
        
        // 2. Dùng vòng lặp forEach để bóc tách từng cuộc tấn công ra
        attackList.forEach(realAttack => {
            // Gán thời gian hiện tại cho log hiển thị đẹp hơn
            realAttack.time = new Date().toLocaleTimeString();

            // Thêm từng cái một vào mảng sự kiện tổng
            attacks.push(realAttack);
        });

        // Giữ tối đa 60 sự kiện hiển thị trên bản đồ để chống giật lag
        if (attacks.length > 60) {
            // Dùng slice để cắt mảng chuẩn xác hơn shift()
            attacks = attacks.slice(attacks.length - 60); 
        }

        // Vẽ lại bản đồ và cập nhật timeline
        updateChart();
        renderTimeline();
    } catch (error) {
        console.error("Lỗi xử lý dữ liệu từ Backend:", error);
    }
};

socket.onclose = () => {
    console.log("Đã mất kết nối tới Backend");
};

socket.onerror = (error) => {
    console.error("Lỗi kết nối WebSocket:", error);
};

/* CLICK VÀO ĐƯỜNG BAY TRÊN BẢN ĐỒ */
chart.on('click', function (params) {
    if (params.data && params.data.value) {
        const a = params.data.value;
        alert(
            `ATTACK\nIP: ${a.ip}\n${a.fromCountry} → ${a.toCountry}\nType: ${a.type}`
        );
    }
});
</script>

</body>
</html>
